<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lee 理想中的游戏大陆</title>
  <link rel="stylesheet" href="continent.css" />
</head>
<body>
  <main class="page">
    <section class="intro" aria-labelledby="site-title">
      <div class="intro-copy">
        <p class="eyebrow">Lee's Game Continent</p>
        <h1 id="site-title">Lee 理想中的游戏大陆</h1>
        <p class="lead">这里会慢慢收纳我做出来、想出来、还在发芽的小游戏。每一个入口都是一块新的土地。</p>
      </div>
      <img class="mascot" src="games/xiaoai-egg-catch/assets/xiaoai/idle_t.png" alt="小艾" />
    </section>

    <section class="shelf" aria-label="游戏项目">
      <article class="game-card live">
        <div class="game-art">
          <img src="games/xiaoai-egg-catch/assets/egg/yellow/idle.png" alt="黄蛋仔" />
          <img src="games/xiaoai-egg-catch/assets/egg/pink/idle.png" alt="粉蛋仔" />
          <img src="games/xiaoai-egg-catch/assets/egg/blue/idle.png" alt="蓝蛋仔" />
        </div>
        <div class="game-body">
          <p class="status">已开放</p>
          <h2>小艾抓蛋仔大作战</h2>
          <p>操控小艾，在限时关卡里抓住 5 只性格不同的蛋仔。抓到的蛋会回到农场里散步。</p>
          <div class="actions">
            <a class="primary" href="games/xiaoai-egg-catch/">进入游戏</a>
            <a class="secondary" href="games/xiaoai-egg-catch/farm.html">蛋蛋农场</a>
          </div>
        </div>
      </article>

      <article class="game-card quiet">
        <div class="placeholder-mark">02</div>
        <div class="game-body">
          <p class="status">待开垦</p>
          <h2>下一片游戏土地</h2>
          <p>新的小游戏会继续长在这里。现在先把第一块地照顾好。</p>
        </div>
      </article>
    </section>
  </main>
</body>
</html>
