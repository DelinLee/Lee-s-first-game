<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Lee 的梦想大陆</title>
  <link rel="icon" type="image/png" href="games/xiaoai-egg-catch/assets/egg/yellow/idle.png" />
  <link rel="stylesheet" href="continent.css" />
</head>
<body>
  <div class="stage">
    <div class="map" id="map">
      <!-- 底图：优先空背景 continent_base.png；没有则回退整张 continent_bg.png -->
      <img class="base-layer" id="base"
           src="assets/ui/continent_base.png" alt="Lee 的梦想大陆"
           onerror="this.onerror=null; this.src='assets/ui/continent_bg.png';" />

      <!-- 建筑分层：各自整画布、透明、原位；缺失则自动隐藏。transform-origin 由 JS 设为该建筑中心 -->
      <img class="blayer" data-key="mountain" src="assets/ui/layer_mountain.png" alt=""
           onerror="this.classList.add('missing')" />
      <img class="blayer" data-key="forest" src="assets/ui/layer_forest.png" alt=""
           onerror="this.classList.add('missing')" />
      <img class="blayer" data-key="harbor" src="assets/ui/layer_harbor.png" alt=""
           onerror="this.classList.add('missing')" />
      <img class="blayer" data-key="town" src="assets/ui/layer_town.png" alt=""
           onerror="this.classList.add('missing')" />
      <img class="blayer" data-key="farm" src="assets/ui/layer_farm.png" alt=""
           onerror="this.classList.add('missing')" />

      <header class="title-band">
        <p class="eyebrow">LEE'S DREAM CONTINENT</p>
        <h1>Lee 的梦想大陆</h1>
      </header>

      <!-- 跟随鼠标的名字提示 -->
      <div id="tip" class="tip" hidden></div>
    </div>
  </div>

  <!-- 敬请期待 弹窗 -->
  <div class="modal-mask" id="modal" hidden>
    <div class="modal-card">
      <div class="modal-emoji" id="modal-emoji">🚧</div>
      <h2 id="modal-title">敬请期待</h2>
      <p id="modal-desc">这片土地还在发芽，新的玩法很快会长出来。</p>
      <button class="modal-close" id="modal-close">知道啦</button>
    </div>
  </div>

  <script src="continent.js"></script>
</body>
</html>
